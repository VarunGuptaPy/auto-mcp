services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-2}
      - JOB_TIMEOUT_SECONDS=${JOB_TIMEOUT_SECONDS:-600}
      - RUNS_DIR=/app/runs
    volumes:
      - runs_data:/app/runs
    restart: unless-stopped
    shm_size: "2gb"
    # api is internal — only the web service talks to it directly

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Internal Docker network hostname for the api service
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  runs_data:
